[project]
name = "tells"
version = "0.1.0"
description = "Every writer has tells. Learn yours, then check which ones a draft is missing and which AI tells it picked up."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ArchAstro" }]
keywords = ["writing", "style", "stylometry", "ai-detection", "agent-skills"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/ArchAstro/tells"
Issues = "https://github.com/ArchAstro/tells/issues"
Changelog = "https://github.com/ArchAstro/tells/blob/main/CHANGELOG.md"
dependencies = ["nltk>=3.9", "certifi"]

[project.scripts]
tells = "tells.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/tells/lib/tells"]

[tool.pytest.ini_options]
testpaths = ["tests"]
