[project]
name = "tells"
version = "0.1.0"
description = "Model how you write (grammar and surface habits) and check drafts against it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["nltk>=3.9", "certifi"]

[project.scripts]
tells = "tells.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/tells/lib/tells"]

[tool.pytest.ini_options]
testpaths = ["tests"]
